name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Fetch vendored Phaser library (pinned 3.70.0)
        run: npm run fetch:phaser

      - name: Add the Android platform (only if not already generated)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android/ already present - skipping cap add android"
          fi

      - name: Sync web build into the Android project
        run: npx cap sync android

      - name: Set app display name to "Bubble Shooter"
        run: |
          STRINGS="android/app/src/main/res/values/strings.xml"
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Bubble Shooter</string>#' "$STRINGS"
          sed -i 's#<string name="title_activity_main">.*</string>#<string name="title_activity_main">Bubble Shooter</string>#' "$STRINGS"

      - name: Lock the app to portrait orientation
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android:screenOrientation="portrait"' "$MANIFEST"; then
            sed -i '0,/<activity/s//<activity\n            android:screenOrientation="portrait"/' "$MANIFEST"
          fi

      - name: Add the VIBRATE permission (required for haptics on Android)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.VIBRATE' "$MANIFEST"; then
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' "$MANIFEST"
          fi

      - name: Generate Android app icons from resources/icon.png
        run: npx @capacitor/assets generate --android

      - name: Build the debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload the debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bubble-shooter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
