/* ============================== LEVEL SELECT SCENE ========================= */
class LevelSelectScene extends Phaser.Scene {
  constructor() { super('LevelSelect'); }
  create() {
    GAME_SAVE = SaveManager.load(); // refresh in case updated elsewhere
    const w = CONFIG.DESIGN_W, h = CONFIG.DESIGN_H;
    addPremiumBackground(this);

    this.add.text(w / 2, 110, 'Select Level', {
      fontFamily: 'Segoe UI, Arial', fontSize: '58px', color: '#ffffff', fontStyle: 'bold'
    }).setOrigin(0.5);

    createButton(this, 110, 110, 140, 100, 'panel_secondary', '<', 44, () => {
      this.scene.start('Menu');
    });

    // Scrollable level grid
    const cols = 4;
    const cellSize = 220;
    const gridW = cols * cellSize;
    const startX = w / 2 - gridW / 2 + cellSize / 2;
    const startY = 260;
    const rows = Math.ceil(LEVELS.length / cols);

    const maskShape = this.make.graphics();
    maskShape.fillStyle(0xffffff);
    maskShape.fillRect(0, 230, w, h - 420);
    const mask = maskShape.createGeometryMask();

    const listContainer = this.add.container(0, 0);
    listContainer.setMask(mask);

    LEVELS.forEach((lvl, idx) => {
      const col = idx % cols, row = Math.floor(idx / cols);
      const x = startX + col * cellSize;
      const y = startY + row * cellSize;
      const unlocked = lvl.id <= GAME_SAVE.unlockedLevel;
      const card = this.add.container(x, y);
      const panel = this.add.image(0, 0, unlocked ? 'panel_primary' : 'panel_secondary');
      panel.setDisplaySize(180, 180);
      card.add(panel);
      if (unlocked) {
        const numText = this.add.text(0, -20, String(lvl.id), {
          fontFamily: 'Segoe UI, Arial', fontSize: '54px', color: '#ffffff', fontStyle: 'bold'
        }).setOrigin(0.5);
        card.add(numText);
        const starCount = Utils.safeGet(GAME_SAVE.stars, lvl.id, 0);
        for (let s = 0; s < 3; s++) {
          const st = this.add.image(-36 + s * 36, 46, s < starCount ? 'star_filled' : 'star_empty');
          st.setDisplaySize(34, 34);
          card.add(st);
        }
        panel.setInteractive({ useHandCursor: true });
        panel.on('pointerup', () => {
          AudioManager.button();
          AudioManager.resume();
          this.scene.start('Game', { levelId: lvl.id });
        });
      } else {
        const lockImg = this.add.image(0, -6, 'lock_icon').setDisplaySize(60, 60);
        card.add(lockImg);
      }
      listContainer.add(card);
    });

    // simple drag-to-scroll
    const contentH = rows * cellSize + 60;
    const viewH = h - 420;
    const maxScroll = Math.max(0, contentH - viewH);
    let dragStartY = null, startScroll = 0;
    this.input.on('pointerdown', p => { dragStartY = p.y; startScroll = listContainer.y; });
    this.input.on('pointermove', p => {
      if (dragStartY === null || !p.isDown) return;
      const dy = p.y - dragStartY;
      listContainer.y = Utils.clamp(startScroll + dy, -maxScroll, 0);
    });
    this.input.on('pointerup', () => { dragStartY = null; });
  }
}

/* ============================== GAME SCENE ================================= */
class GameScene extends Phaser.Scene {
  constructor() { super('Game'); }

  init(data) {
    this.levelId = (data && Number.isInteger(data.levelId)) ? data.levelId : 1;
    this.isShooting = false;
    this.isPaused = false;
    this.isGameOver = false;
    this.isAiming = false;
    this.shotSprite = null;
    this.shotVel = null;
    this.shotColorIndex = -1;
    this.score = 0;
    this.aimDir = { x: 0, y: -1 };
  }

  create() {
    const w = CONFIG.DESIGN_W, h = CONFIG.DESIGN_H;
    this.level = getLevel(this.levelId);
    if (!this.level) {
      console.error('[Game] Could not resolve level - aborting scene start.');
      this.scene.start('LevelSelect');
      return;
    }

    addPremiumBackground(this);

    this.board = new BoardSystem(this);
    const rng = seededRandom(this.level.seed);
    const pattern = generateBoardPattern(this.level.pattern, this.level.startRows, this.level.colorCount, rng);
    this.board.loadPattern(pattern);

    this.wallLeft = this.board.originX - CONFIG.BUBBLE_RADIUS;
    this.wallRight = this.wallLeft + this.board.boardWidth;
    this.ceilingY = this.board.originY - CONFIG.BUBBLE_RADIUS;

    this.shotsRemaining = this.level.shots;
    this.score = 0;

    this.shooterX = w / 2;
    this.shooterY = CONFIG.SHOOTER_Y;

    this.currentColorIndex = this.pickRandomColor();
    this.nextColorIndex = this.pickRandomColor();

    // --- Shooter visuals ---
    this.cannonBaseY = this.shooterY + 30;

    // Soft ground-glow platform beneath the cannon for depth/grounding.
    this.shooterGlow = this.add.image(this.shooterX, this.cannonBaseY + 70, 'ground_glow');
    this.shooterGlow.setDisplaySize(520, 220);
    this.shooterGlow.setDepth(18);

    this.cannonImg = this.add.image(this.shooterX, this.cannonBaseY, 'shooter_cannon');
    this.cannonImg.setDisplaySize(160, 230);
    this.cannonImg.setDepth(20);
    this.cannonRotation = 0;       // current smoothed rotation (radians, 0 = pointing straight up)
    this.cannonTargetRotation = 0; // rotation we're easing toward

    // Muzzle glow (small light at the barrel tip, brightens briefly on fire)
    this.muzzleGlow = this.add.image(this.shooterX, this.shooterY - 90, 'particle_glow');
    this.muzzleGlow.setDisplaySize(50, 50);
    this.muzzleGlow.setDepth(19);
    this.muzzleGlow.setAlpha(0);
    this.muzzleGlow.setBlendMode(Phaser.BlendModes.ADD);

    // Next-bubble preview: a glowing "well" badge with a clean NEXT pill label.
    this.nextPreviewRing = this.add.image(this.shooterX + 195, this.shooterY + 55, 'preview_badge');
    this.nextPreviewRing.setDisplaySize(130, 130);
    this.nextPreviewRing.setDepth(20);
    this.nextLabelPill = this.add.graphics().setDepth(21);
    this.nextLabelPill.fillStyle(0x2c3358, 0.9);
    this.nextLabelPill.fillRoundedRect(this.shooterX + 195 - 54, this.shooterY - 26, 108, 34, 17);
    this.nextLabelPill.lineStyle(2, 0x4a5690, 0.8);
    this.nextLabelPill.strokeRoundedRect(this.shooterX + 195 - 54, this.shooterY - 26, 108, 34, 17);
    this.nextPreviewLabel = this.add.text(this.shooterX + 195, this.shooterY - 9, 'NEXT', {
      fontFamily: 'Segoe UI, Arial', fontSize: '20px', color: '#c3cdf0', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(22);

    this.currentBubbleSprite = null;
    this.nextBubbleSprite = null;
    this.refreshQueueSprites(false);

    this.aimGraphics = this.add.graphics();
    this.aimGraphics.setDepth(15);
    this.aimReticle = this.add.image(0, 0, 'bubble_red'); // recolored per-shot; hidden until aiming
    this.aimReticle.setDepth(16).setAlpha(0).setDisplaySize(CONFIG.BUBBLE_RADIUS * 1.7, CONFIG.BUBBLE_RADIUS * 1.7);
    this.comboStreak = 0;
    this.comboResetTimer = null;

    // --- HUD ---
    this.buildHUD();

    // --- Input ---
    this.input.on('pointerdown', this.onPointerDown, this);
    this.input.on('pointermove', this.onPointerMove, this);
    this.input.on('pointerup', this.onPointerUp, this);
    this.input.on('pointerupoutside', this.onPointerUp, this);

    // --- overlay containers, built lazily ---
    this.pauseOverlay = null;
    this.endOverlay = null;

    // --- cleanup on shutdown: stop timers/tweens, remove listeners, free board sprites ---
    this.events.once('shutdown', this.cleanupScene, this);
    this.events.once('destroy', this.cleanupScene, this);
  }

  cleanupScene() {
    try {
      this.input.off('pointerdown', this.onPointerDown, this);
      this.input.off('pointermove', this.onPointerMove, this);
      this.input.off('pointerup', this.onPointerUp, this);
      this.input.off('pointerupoutside', this.onPointerUp, this);
      this.tweens.killAll();
      this.time.removeAllEvents();
      if (this.board) this.board.destroyAll();
    } catch (e) {
      console.warn('[Game] Cleanup encountered an issue (non-fatal):', e);
    }
  }

  pickRandomColor() {
    const count = Utils.clamp(this.level.colorCount, 1, CONFIG.COLORS.length);
    if (this.board) {
      const present = new Set();
      for (let r = 0; r < CONFIG.MAX_ROWS; r++) {
        const cols = Utils.colsInRow(r);
        for (let c = 0; c < cols; c++) {
          const col = this.board.getColor(r, c);
          if (col >= 0) present.add(col);
        }
      }
      if (present.size > 0) {
        const arr = Array.from(present);
        return arr[Math.floor(Math.random() * arr.length)];
      }
    }
    return Math.floor(Math.random() * count);
  }

  refreshQueueSprites(animate) {
    if (this.currentBubbleSprite && this.currentBubbleSprite.active) this.currentBubbleSprite.destroy();
    if (this.nextBubbleSprite && this.nextBubbleSprite.active) this.nextBubbleSprite.destroy();
    const curKey = 'bubble_' + CONFIG.COLORS[this.currentColorIndex].key;
    const nextKey = 'bubble_' + CONFIG.COLORS[this.nextColorIndex].key;
    const fullSize = CONFIG.BUBBLE_RADIUS * 2;
    const nextSize = CONFIG.BUBBLE_RADIUS * 1.1;

    this.currentBubbleSprite = this.add.image(this.shooterX, this.shooterY, curKey);
    this.currentBubbleSprite.setDepth(21);
    this.nextBubbleSprite = this.add.image(this.shooterX + 195, this.shooterY + 55, nextKey);
    this.nextBubbleSprite.setDepth(21);
    this.nextBubbleSprite.setAlpha(0.95);

    if (animate) {
      // Bubble hops into place with a light squash-and-settle instead of popping in flat-footed.
      this.currentBubbleSprite.setDisplaySize(fullSize * 0.5, fullSize * 0.5);
      this.currentBubbleSprite.setAlpha(0.4);
      this.tweens.add({
        targets: this.currentBubbleSprite, alpha: 1, duration: 160, ease: 'Cubic.easeOut'
      });
      this.tweens.add({
        targets: this.currentBubbleSprite, displayWidth: fullSize, displayHeight: fullSize,
        duration: 220, ease: 'Back.easeOut'
      });
      this.nextBubbleSprite.setDisplaySize(nextSize * 0.5, nextSize * 0.5);
      this.tweens.add({
        targets: this.nextBubbleSprite, displayWidth: nextSize, displayHeight: nextSize,
        duration: 220, delay: 60, ease: 'Back.easeOut'
      });
    } else {
      this.currentBubbleSprite.setDisplaySize(fullSize, fullSize);
      this.nextBubbleSprite.setDisplaySize(nextSize, nextSize);
    }
  }

  buildHUD() {
    const w = CONFIG.DESIGN_W;
    this.hudPanel = this.add.image(w / 2, 100, 'panel_hud').setDisplaySize(w, 200).setDepth(30);

    // --- Level pill (top-left) ---
    const pillW = 168, pillH = 44, pillX = 40, pillY = 20;
    this.levelPill = this.add.graphics().setDepth(31);
    this.levelPill.fillStyle(0x2c3358, 0.85);
    this.levelPill.fillRoundedRect(pillX, pillY, pillW, pillH, pillH / 2);
    this.levelPill.lineStyle(2, 0x5b8def, 0.6);
    this.levelPill.strokeRoundedRect(pillX, pillY, pillW, pillH, pillH / 2);
    this.levelText = this.add.text(pillX + pillW / 2, pillY + pillH / 2, 'LEVEL ' + this.level.id, {
      fontFamily: 'Segoe UI, Arial', fontSize: '26px', color: '#c3cdf0', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(32);

    // --- Score (label + big value), typography hierarchy: small caps label, large bold number ---
    this.scoreLabel = this.add.text(pillX + 2, 86, 'SCORE', {
      fontFamily: 'Segoe UI, Arial', fontSize: '22px', color: '#7c8ac0', fontStyle: 'bold'
    }).setDepth(31);
    this.scoreText = this.add.text(pillX, 112, '0', {
      fontFamily: 'Segoe UI, Arial', fontSize: '54px', color: '#ffffff', fontStyle: 'bold'
    }).setDepth(31);
    this.scoreText.setShadow(0, 2, 'rgba(0,0,0,0.4)', 4);

    // --- Score progress bar (visual polish only - shows score vs. target) ---
    const barX = pillX, barY = 178, barW = 480, barH = 14;
    this.scoreBarTrack = this.add.graphics().setDepth(31);
    this.scoreBarTrack.fillStyle(0x151a34, 0.9);
    this.scoreBarTrack.fillRoundedRect(barX, barY, barW, barH, barH / 2);
    this.scoreBarTrack.lineStyle(2, 0x2c3358, 1);
    this.scoreBarTrack.strokeRoundedRect(barX, barY, barW, barH, barH / 2);
    this.scoreBarWidth = barW;
    this.scoreBarFill = this.add.rectangle(barX + barH / 2, barY + barH / 2, 1, barH - 4, 0x5b8def)
      .setOrigin(0, 0.5).setDepth(32);
    this.scoreBarLabel = this.add.text(barX + barW, barY + barH / 2, '/ ' + this.level.targetScore, {
      fontFamily: 'Segoe UI, Arial', fontSize: '22px', color: '#7c8ac0', fontStyle: 'bold'
    }).setOrigin(1, 0.5).setDepth(31);
    // move the target number just above the right end of the bar for a cleaner read
    this.scoreBarLabel.setPosition(barX + barW, barY - 16);
    this.scoreBarLabel.setOrigin(1, 1);

    // --- Shots remaining badge (top-right, circular accent badge) ---
    const shotsCX = w - 100, shotsCY = 82;
    this.shotsBadge = this.add.image(shotsCX, shotsCY, 'btn_circle_accent').setDisplaySize(104, 104).setDepth(31);
    this.shotsText = this.add.text(shotsCX, shotsCY - 6, String(this.shotsRemaining), {
      fontFamily: 'Segoe UI, Arial', fontSize: '40px', color: '#2a1a08', fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(32);
    this.shotsSubText = this.add.text(shotsCX, shotsCY, 'SHOTS', {
      fontFamily: 'Segoe UI, Arial', fontSize: '15px', color: '#4a2f0c', fontStyle: 'bold'
    }).setOrigin(0.5, -1.15).setDepth(32);

    // --- Pause button (circular icon button, drawn crisp with Graphics bars) ---
    const pauseCX = w - 100, pauseCY = 195;
    this.pauseBtn = createButton(this, pauseCX, pauseCY, 92, 92, 'btn_circle', '', 0, () => {
      this.openPause();
    });
    this.pauseBtn.setDepth(31);
    const pauseIcon = this.add.graphics().setDepth(32);
    pauseIcon.fillStyle(0xe8ecfb, 1);
    pauseIcon.fillRoundedRect(-16, -18, 12, 36, 3);
    pauseIcon.fillRoundedRect(4, -18, 12, 36, 3);
    this.pauseBtn.add(pauseIcon);

    this.updateHUD(); // sync bar/text with initial score & shots state
  }

  updateHUD() {
    if (this.scoreText) this.scoreText.setText(String(this.score));
    if (this.shotsText) this.shotsText.setText(String(Math.max(0, this.shotsRemaining)));
    if (this.scoreBarFill && this.level && this.level.targetScore > 0) {
      const ratio = Utils.clamp(this.score / this.level.targetScore, 0, 1);
      const barH = this.scoreBarFill.height;
      this.scoreBarFill.setSize(Math.max(1, this.scoreBarWidth * ratio), barH);
    }
  }

  // Pure score bookkeeping - updates the running total and HUD text only.
  // Visual feedback is handled separately by showScorePopup() so combo/streak
  // juice can be layered on without duplicating the scorekeeping logic.
  addScoreValue(amount) {
    this.score += amount;
    this.updateHUD();
  }

  // Score popup with combo-aware juice: bigger pop-in scale, brighter color,
  // and a "COMBO xN" callout when the player is chaining matches quickly.
  showScorePopup(amount, big) {
    this.addScoreValue(amount);
    const streak = this.comboStreak || 0;
    const color = big ? '#ff8c42' : '#ffe98a';
    const fontSize = big ? 56 : 40;

    const popup = this.add.text(this.shooterX, this.shooterY - 120, '+' + amount, {
      fontFamily: 'Segoe UI, Arial', fontSize: fontSize + 'px', color, fontStyle: 'bold'
    }).setOrigin(0.5).setDepth(50);
    popup.setScale(big ? 0.4 : 0.7);
    this.tweens.add({
      targets: popup, scale: 1, duration: 140, ease: 'Back.easeOut'
    });
    this.tweens.add({
      targets: popup, y: popup.y - (big ? 130 : 80), alpha: 0, duration: 750, delay: 140, ease: 'Cubic.easeOut',
      onComplete: () => { if (popup && popup.active) popup.destroy(); }
    });

    if (streak >= 2) {
      const comboText = this.add.text(this.shooterX, this.shooterY - 190, 'COMBO x' + streak + '!', {
        fontFamily: 'Segoe UI, Arial', fontSize: '44px', color: '#ff5d7a', fontStyle: 'bold'
      }).setOrigin(0.5).setDepth(51);
      comboText.setScale(0);
      this.tweens.add({
        targets: comboText, scale: 1, duration: 160, ease: 'Back.easeOut',
        onComplete: () => {
          this.tweens.add({
            targets: comboText, y: comboText.y - 60, alpha: 0, duration: 500, delay: 250, ease: 'Cubic.easeOut',
            onComplete: () => { if (comboText && comboText.active) comboText.destroy(); }
          });
        }
      });
    }
  }

  /* ---------------------------- AIMING / INPUT ---------------------------- */
  onPointerDown(pointer) {
    if (this.isPaused || this.isGameOver || this.isShooting) return;
    // Full-screen drag-to-aim: touch anywhere (board, empty space, near the
    // shooter) and start aiming immediately - more forgiving on mobile than
    // requiring a precise tap near the cannon.
    this.isAiming = true;
    this.updateAim(pointer);
  }

  onPointerMove(pointer) {
    if (!this.isAiming) return;
    if (this.isPaused || this.isGameOver || this.isShooting) { this.cancelAim(); return; }
    this.updateAim(pointer);
  }

  onPointerUp(pointer) {
    if (!this.isAiming) return;
    this.isAiming = false;
    this.hideAimVisuals();
    if (this.isPaused || this.isGameOver || this.isShooting) return;
    this.shootBubble();
  }

  cancelAim() {
    this.isAiming = false;
    this.hideAimVisuals();
  }

  hideAimVisuals() {
    this.aimGraphics.clear();
    if (this.aimReticle) this.aimReticle.setAlpha(0);
    this.cannonTargetRotation = 0; // relax back to pointing straight up
  }

  computeClampedAimDir(pointerX, pointerY) {
    let dx = pointerX - this.shooterX;
    let dy = pointerY - this.shooterY;
    if (dy > -60) dy = -60; // never allow downward or near-horizontal shots
    let angle = Math.atan2(dy, dx);
    const minA = Phaser.Math.DegToRad(-169);
    const maxA = Phaser.Math.DegToRad(-11);
    angle = Utils.clamp(angle, minA, maxA);
    return { x: Math.cos(angle), y: Math.sin(angle) };
  }

  updateAim(pointer) {
    this.aimDir = this.computeClampedAimDir(pointer.x, pointer.y);
    // Barrel image points "up" at rotation 0, so offset by 90deg to align with aimDir.
    this.cannonTargetRotation = Math.atan2(this.aimDir.y, this.aimDir.x) + Math.PI / 2;

    const path = this.simulateTrajectory(this.shooterX, this.shooterY, this.aimDir.x, this.aimDir.y);
    this.aimGraphics.clear();

    const colorHex = CONFIG.COLORS[this.currentColorIndex].hex;
    // Soft glowing guide line beneath the dashes for a more premium look.
    this.aimGraphics.lineStyle(10, colorHex, 0.12);
    this.aimGraphics.beginPath();
    this.aimGraphics.moveTo(this.shooterX, this.shooterY);
    path.points.forEach(p => this.aimGraphics.lineTo(p.x, p.y));
    this.aimGraphics.strokePath();

    // Dashed dot trail, shrinking and fading with distance.
    path.points.forEach((p, i) => {
      if (i % 3 !== 0) return;
      const t = i / Math.max(1, path.points.length);
      const alpha = Utils.clamp(1 - t, 0.18, 0.95);
      const size = Utils.clamp(9 - t * 5, 3.5, 9);
      this.aimGraphics.fillStyle(0xffffff, alpha);
      this.aimGraphics.fillCircle(p.x, p.y, size);
    });

    if (path.landing) {
      // Pulsing landing reticle tinted to match the bubble about to be fired.
      this.aimGraphics.lineStyle(4, colorHex, 0.85);
      this.aimGraphics.strokeCircle(path.landing.x, path.landing.y, CONFIG.BUBBLE_RADIUS * 0.95);
      this.aimGraphics.lineStyle(2, 0xffffff, 0.5);
      this.aimGraphics.strokeCircle(path.landing.x, path.landing.y, CONFIG.BUBBLE_RADIUS * 0.65);
      if (this.aimReticle) {
        this.aimReticle.setPosition(path.landing.x, path.landing.y);
        this.aimReticle.setTint(colorHex);
        this.aimReticle.setAlpha(0.35);
      }
    } else if (this.aimReticle) {
      this.aimReticle.setAlpha(0);
    }
  }

  // Shared trajectory simulation used for BOTH the aim preview and the real
  // shot, so the visual guide always matches actual shooting behavior.
  simulateTrajectory(startX, startY, dirX, dirY) {
    const R = CONFIG.BUBBLE_RADIUS;
    let x = startX, y = startY, vx = dirX, vy = dirY;
    const points = [];
    const stepSize = 14;
    const maxSteps = 900;
    let landing = null;
    for (let i = 0; i < maxSteps; i++) {
      x += vx * stepSize;
      y += vy * stepSize;
      if (x <= this.wallLeft) { x = this.wallLeft; vx *= -1; }
      if (x >= this.wallRight) { x = this.wallRight; vx *= -1; }
      points.push({ x, y });
      if (y - R <= this.ceilingY) { landing = { x, y }; break; }
      const hit = this.findCollisionCellAt(x, y);
      if (hit) { landing = { x, y, cell: hit }; break; }
      if (points.length > 260) break; // safety cap on preview length
    }
    return { points, landing };
  }

  findCollisionCellAt(x, y) {
    if (!this.board) return null;
    const approxRow = Utils.clamp(Math.round((y - this.board.originY) / this.board.rowH), 0, CONFIG.MAX_ROWS - 1);
    for (let r = Math.max(0, approxRow - 2); r <= Math.min(CONFIG.MAX_ROWS - 1, approxRow + 2); r++) {
      const cols = Utils.colsInRow(r);
      for (let c = 0; c < cols; c++) {
        if (this.board.getColor(r, c) < 0) continue;
        const p = this.board.cellToWorld(r, c);
        if (Utils.dist(x, y, p.x, p.y) < CONFIG.BUBBLE_RADIUS * 1.92) {
          return { row: r, col: c };
        }
      }
    }
    return null;
  }

  /* ---------------------------- SHOOTING ----------------------------------- */
  shootBubble() {
    if (this.isShooting || this.isPaused || this.isGameOver) return; // prevent multiple simultaneous shots
    if (!this.currentBubbleSprite || !this.currentBubbleSprite.active) {
      console.warn('[Game] No current bubble to shoot - refreshing queue defensively.');
      this.refreshQueueSprites();
      return;
    }
    this.isShooting = true;
    this.shotColorIndex = this.currentColorIndex;
    this.shotSprite = this.currentBubbleSprite;
    this.currentBubbleSprite = null;
    this.shotVel = { x: this.aimDir.x, y: this.aimDir.y };
    AudioManager.shoot();
    this.playCannonRecoil();
    this.playMuzzleFlash();

    // Quick launch squash-and-stretch on the bubble itself for extra punch.
    const stretchX = 1 + Math.abs(this.aimDir.y) * 0.28;
    const stretchY = 1 - Math.abs(this.aimDir.y) * 0.18;
    this.shotSprite.setDisplaySize(CONFIG.BUBBLE_RADIUS * 2 * stretchX, CONFIG.BUBBLE_RADIUS * 2 * stretchY);
    this.tweens.add({
      targets: this.shotSprite,
      displayWidth: CONFIG.BUBBLE_RADIUS * 2, displayHeight: CONFIG.BUBBLE_RADIUS * 2,
      duration: 140, ease: 'Cubic.easeOut'
    });
  }

  playCannonRecoil() {
    if (!this.cannonImg || !this.cannonImg.active) return;
    this.tweens.killTweensOf(this.cannonImg); // avoid stacking recoils on rapid-fire taps
    const kickX = Math.sin(this.cannonRotation) * -14;
    const kickY = Math.cos(this.cannonRotation) * 14;
    this.cannonImg.x = this.shooterX + kickX;
    this.cannonImg.y = this.cannonBaseY + kickY;
    this.cannonImg.scaleY *= 0.9;
    this.tweens.add({
      targets: this.cannonImg,
      x: this.shooterX, y: this.cannonBaseY, duration: 160, ease: 'Back.easeOut'
    });
    this.tweens.add({
      targets: this.cannonImg,
      scaleY: this.cannonImg.scaleY / 0.9, duration: 160, ease: 'Back.easeOut'
    });
  }

  playMuzzleFlash() {
    if (!this.muzzleGlow || !this.muzzleGlow.active) return;
    const tipDist = 150;
    this.muzzleGlow.setPosition(
      this.shooterX + this.aimDir.x * tipDist,
      this.shooterY - 20 + this.aimDir.y * tipDist
    );
    this.muzzleGlow.setTint(CONFIG.COLORS[this.shotColorIndex].hex);
    this.muzzleGlow.setAlpha(0.85);
    this.muzzleGlow.setDisplaySize(70, 70);
  }

  update(time, delta) {
    // Smoothly ease the cannon toward its aim/rest rotation every frame instead
    // of snapping, which reads as far more premium on a touch drag.
    if (this.cannonImg && this.cannonImg.active) {
      const lerpFactor = Utils.clamp(delta / 90, 0, 1);
      this.cannonRotation = Phaser.Math.Linear(this.cannonRotation, this.cannonTargetRotation, lerpFactor);
      this.cannonImg.setRotation(this.cannonRotation);
    }
    if (this.muzzleGlow && this.muzzleGlow.active && this.muzzleGlow.alpha > 0) {
      this.muzzleGlow.setAlpha(Math.max(0, this.muzzleGlow.alpha - delta / 220));
    }
    if (this.isShooting && this.shotSprite && this.shotSprite.active) {
      this.advanceShot(delta);
    }
  }

  advanceShot(delta) {
    const R = CONFIG.BUBBLE_RADIUS;
    const dtSec = Math.min(delta, 40) / 1000; // clamp delta to avoid huge jumps on tab-switch lag
    let remaining = CONFIG.SHOT_SPEED * dtSec;
    const stepSize = R * 0.4;
    const substeps = Math.max(1, Math.ceil(remaining / stepSize));
    const step = remaining / substeps;

    for (let i = 0; i < substeps; i++) {
      if (!this.shotSprite || !this.shotSprite.active) return; // sprite could be destroyed mid-loop; bail safely
      this.shotSprite.x += this.shotVel.x * step;
      this.shotSprite.y += this.shotVel.y * step;

      if (this.shotSprite.x <= this.wallLeft) { this.shotSprite.x = this.wallLeft; this.shotVel.x *= -1; this.playWallBounceFeedback(); }
      if (this.shotSprite.x >= this.wallRight) { this.shotSprite.x = this.wallRight; this.shotVel.x *= -1; this.playWallBounceFeedback(); }

      if (this.shotSprite.y - R <= this.ceilingY) {
        this.attachShotBubble(null);
        return;
      }
      const hit = this.findCollisionCellAt(this.shotSprite.x, this.shotSprite.y);
      if (hit) {
        this.attachShotBubble(hit);
        return;
      }
    }
  }

  // Quick visual "thunk" on wall contact - a brief horizontal squash plus a
  // tiny spark, layered on top of the existing bounce sound and physics
  // (the actual dx reflection is untouched, this is purely cosmetic feedback).
  playWallBounceFeedback() {
    AudioManager.wallBounce();
    if (!this.shotSprite || !this.shotSprite.active) return;
    const spr = this.shotSprite;
    this.tweens.killTweensOf(spr); // avoid stacking squashes if bounces happen back-to-back
    const full = CONFIG.BUBBLE_RADIUS * 2;
    spr.setDisplaySize(full * 0.75, full * 1.15);
    this.tweens.add({
      targets: spr, displayWidth: full, displayHeight: full,
      duration: 130, ease: 'Back.easeOut'
    });

    const spark = this.add.image(spr.x, spr.y, 'particle_glow');
    spark.setDisplaySize(46, 46);
    spark.setDepth(41);
    spark.setBlendMode(Phaser.BlendModes.ADD);
    spark.setAlpha(0.8);
    this.tweens.add({
      targets: spark, alpha: 0, scale: 0.3, duration: 180, ease: 'Cubic.easeOut',
      onComplete: () => { if (spark && spark.active) spark.destroy(); }
    });
  }

  findLandingCell(x, y, hitCell) {
    let candidates = [];
    if (hitCell && this.board.isValidCell(hitCell.row, hitCell.col)) {
      candidates = this.board.getNeighbors(hitCell.row, hitCell.col).filter(n => this.board.getColor(n.row, n.col) < 0);
    }
    if (candidates.length === 0) {
      const approxRow = Utils.clamp(Math.round((y - this.board.originY) / this.board.rowH), 0, CONFIG.MAX_ROWS - 1);
      for (let r = Math.max(0, approxRow - 1); r <= Math.min(CONFIG.MAX_ROWS - 1, approxRow + 1); r++) {
        const cols = Utils.colsInRow(r);
        for (let c = 0; c < cols; c++) {
          if (this.board.getColor(r, c) < 0) candidates.push({ row: r, col: c });
        }
      }
    }
    if (candidates.length === 0) {
      console.warn('[Game] No empty landing cell found near', x, y, '- using row 0 fallback.');
      return { row: 0, col: 0 };
    }
    let best = candidates[0], bestD = Infinity;
    for (const cand of candidates) {
      const p = this.board.cellToWorld(cand.row, cand.col);
      const d = Utils.dist(x, y, p.x, p.y);
      if (d < bestD) { bestD = d; best = cand; }
    }
    return best;
  }

  attachShotBubble(hitCell) {
    if (!this.shotSprite) return; // already handled/destroyed - avoid double-processing
    const x = this.shotSprite.x, y = this.shotSprite.y;
    const target = this.findLandingCell(x, y, hitCell);
    const colorIndex = this.shotColorIndex;
    this.shotSprite.destroy();
    this.shotSprite = null;
    this.shotVel = null;

    if (!this.board.isValidCell(target.row, target.col) || this.board.getColor(target.row, target.col) >= 0) {
      console.error('[Game] Landing cell invalid or occupied - aborting attach safely.', target);
      this.finishShotCycle();
      return;
    }
    this.board.setBubble(target.row, target.col, colorIndex);
    AudioManager.attach();

    // Quick squash-settle impact animation instead of popping in at full size.
    const landedSprite = this.board.getSprite(target.row, target.col);
    if (landedSprite && landedSprite.active) {
      const full = CONFIG.BUBBLE_RADIUS * 2;
      landedSprite.setDisplaySize(full * 1.25, full * 0.8);
      this.tweens.add({
        targets: landedSprite, displayWidth: full, displayHeight: full,
        duration: 160, ease: 'Back.easeOut'
      });
    }

    this.resolveMatches(target.row, target.col);
  }

  resolveMatches(row, col) {
    const group = this.board.findMatchGroup(row, col);
    if (group.length >= 3) {
      this.popGroup(group);
    } else {
      this.finishShotCycle();
    }
  }

  popGroup(group) {
    const bonus = group.length > 3 ? (group.length - 3) * 30 : 0;
    const totalScore = group.length * 100 + bonus;
    this.registerCombo();
    const isBigMatch = group.length >= 5 || this.comboStreak >= 3;

    group.forEach((cell, i) => {
      const color = this.board.getColor(cell.row, cell.col);
      const spr = this.board.getSprite(cell.row, cell.col);
      // Clear authoritative data immediately so match/float logic downstream
      // never sees a bubble that's already been popped.
      this.board.data[cell.row][cell.col] = -1;
      this.board.sprites[cell.row][cell.col] = null;
      if (spr && spr.active) {
        const baseScale = spr.scaleX;
        spr.setBlendMode(Phaser.BlendModes.NORMAL);
        // Two-step pop: a quick bright bump outward, then shrink-and-fade away.
        this.tweens.add({
          targets: spr, scale: baseScale * 1.3, rotation: (Math.random() - 0.5) * 0.6,
          duration: 90, delay: i * 16, ease: 'Cubic.easeOut',
          onComplete: () => {
            if (!spr || !spr.active) return;
            this.tweens.add({
              targets: spr, scale: 0.05, alpha: 0, duration: 160, ease: 'Cubic.easeIn',
              onComplete: () => { if (spr && spr.active) spr.destroy(); }
            });
          }
        });
      }
      this.spawnPopParticles(cell.row, cell.col, color);
      AudioManager.pop(i);
    });

    this.showScorePopup(totalScore, isBigMatch);
    AudioManager.matchFeedback(group.length, isBigMatch); // one haptic/chime per match event, not per bubble
    if (isBigMatch) this.cameras.main.shake(120, 0.0035); // subtle punch on big/combo matches

    this.time.delayedCall(200, () => {
      this.resolveFloating();
    });
  }

  // Tracks quick successive matches to reward chained shots with a combo
  // callout. The streak resets automatically if there's a pause between pops.
  registerCombo() {
    this.comboStreak = (this.comboStreak || 0) + 1;
    if (this.comboResetTimer) this.comboResetTimer.remove(false);
    this.comboResetTimer = this.time.delayedCall(1400, () => { this.comboStreak = 0; });
  }

  resolveFloating() {
    const floating = this.board.findFloatingBubbles();
    if (floating.length > 0) {
      // Stagger by row so higher clusters lead the collapse, like a real cascade.
      const minRow = floating.reduce((m, c) => Math.min(m, c.row), floating[0].row);
      floating.forEach((cell) => {
        const spr = this.board.getSprite(cell.row, cell.col);
        const colorIndex = this.board.getColor(cell.row, cell.col);
        this.board.data[cell.row][cell.col] = -1;
        this.board.sprites[cell.row][cell.col] = null;
        if (spr && spr.active) {
          const delay = (cell.row - minRow) * 40 + Math.random() * 60;
          const startY = spr.y;
          const swayTarget = spr.x + (Math.random() - 0.5) * 90;
          const rot = (Math.random() - 0.5) * 6;
          const fallDuration = 620 + Math.random() * 140;
          const full = CONFIG.BUBBLE_RADIUS * 2;

          // 1) Tiny anticipation hop - a brief upward lift + squash before it
          // actually lets go, so the detachment reads as a deliberate beat
          // rather than bubbles just silently sliding down.
          this.tweens.add({
            targets: spr, y: startY - 12, displayWidth: full * 1.08, displayHeight: full * 0.9,
            duration: 90, delay, ease: 'Sine.easeOut',
            onComplete: () => {
              if (!spr || !spr.active) return;
              this.spawnFallSpark(spr.x, spr.y, colorIndex); // 2) clear detachment spark

              // 3-5) accelerating fall with rotation + gentle shrink for depth
              this.tweens.add({
                targets: spr, y: startY + 780, alpha: 0, rotation: rot,
                displayWidth: full * 0.72, displayHeight: full * 0.72,
                duration: fallDuration, ease: 'Cubic.easeIn',
                onComplete: () => { if (spr && spr.active) spr.destroy(); } // 7) fade/removal
              });
              this.tweens.add({ targets: spr, x: swayTarget, duration: fallDuration, ease: 'Sine.easeInOut' });

              // 6) one tasteful trailing sparkle partway through the drop (capped
              // to ~half of falling bubbles so a big cascade doesn't spike particle count)
              if (Math.random() < 0.5) {
                this.time.delayedCall(fallDuration * 0.45, () => {
                  if (spr && spr.active) this.spawnFallSpark(spr.x, spr.y, colorIndex);
                });
              }
            }
          });
        }
      });
      this.showScorePopup(floating.length * 40, false);
      AudioManager.fall();
    }
    this.finishShotCycle();
  }

  // A single small, brief additive spark - cheaper than the full pop-particle
  // burst, used for the falling-bubble detachment/trail beats.
  spawnFallSpark(x, y, colorIndex) {
    const colorDef = CONFIG.COLORS[Utils.clamp(colorIndex, 0, CONFIG.COLORS.length - 1)];
    const p = this.add.image(x, y, 'particle_glow');
    p.setTint(colorDef.hex);
    p.setDisplaySize(22, 22);
    p.setDepth(38);
    p.setBlendMode(Phaser.BlendModes.ADD);
    p.setAlpha(0.9);
    this.tweens.add({
      targets: p, y: y - 18, alpha: 0, scale: 0.3, duration: 320, ease: 'Cubic.easeOut',
      onComplete: () => { if (p && p.active) p.destroy(); }
    });
  }

  spawnPopParticles(row, col, colorIndex) {
    const pos = this.board.cellToWorld(row, col);
    const colorDef = CONFIG.COLORS[Utils.clamp(colorIndex, 0, CONFIG.COLORS.length - 1)];
    // Kept small (6/particle burst) and short-lived for mobile GPU/CPU headroom.
    const count = 6;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      const speed = 120 + Math.random() * 140;
      const p = this.add.image(pos.x, pos.y, 'particle_glow');
      p.setTint(colorDef.hex);
      p.setDisplaySize(28, 28);
      p.setDepth(40);
      p.setBlendMode(Phaser.BlendModes.ADD); // glowy, cheap to render, no extra textures needed
      this.tweens.add({
        targets: p,
        x: pos.x + Math.cos(angle) * speed,
        y: pos.y + Math.sin(angle) * speed,
        alpha: 0,
        scale: 0.2,
        duration: 420 + Math.random() * 150,
        ease: 'Cubic.easeOut',
        onComplete: () => { if (p && p.active) p.destroy(); }
      });
    }
  }

  /* ------------------------- CYCLE / WIN / LOSE ---------------------------- */
  finishShotCycle() {
    if (this.isGameOver) return;
    this.shotsRemaining = Math.max(0, this.shotsRemaining - 1);
    this.updateHUD();
    this.currentColorIndex = this.nextColorIndex;
    this.nextColorIndex = this.pickRandomColor();
    this.refreshQueueSprites(true);
    this.isShooting = false;

    if (this.board.remainingBubbleCount() === 0 || this.score >= this.level.targetScore) {
      this.triggerWin();
      return;
    }
    if (this.board.lowestOccupiedRow() >= CONFIG.DANGER_ROW) {
      this.triggerLose();
      return;
    }
    if (this.shotsRemaining <= 0) {
      this.triggerLose();
      return;
    }
  }

  triggerWin() {
    if (this.isGameOver) return;
    this.isGameOver = true;
    AudioManager.win();
    let stars = 1;
    if (this.score >= this.level.targetScore * 1.6) stars = 3;
    else if (this.score >= this.level.targetScore * 1.25) stars = 2;

    GAME_SAVE = SaveManager.load();
    const prevStars = Utils.safeGet(GAME_SAVE.stars, this.level.id, 0);
    GAME_SAVE.stars[this.level.id] = Math.max(prevStars, stars);
    const prevBest = Utils.safeGet(GAME_SAVE.bestScore, this.level.id, 0);
    GAME_SAVE.bestScore[this.level.id] = Math.max(prevBest, this.score);
    if (this.level.id + 1 > GAME_SAVE.unlockedLevel && this.level.id + 1 <= LEVELS.length) {
      GAME_SAVE.unlockedLevel = this.level.id + 1;
    }
    SaveManager.save(GAME_SAVE);

    AdHooks.onLevelComplete(this.level.id, this.score); // no-op today; future ad seam
    this.showEndOverlay(true, stars);
  }

  triggerLose() {
    if (this.isGameOver) return;
    this.isGameOver = true;
    AudioManager.lose();
    AdHooks.onGameOver(this.level.id, this.score); // no-op today; future ad seam
    this.showEndOverlay(false, 0);
  }

  showEndOverlay(won, stars) {
    const w = CONFIG.DESIGN_W, h = CONFIG.DESIGN_H;
    const overlay = this.add.container(0, 0).setDepth(200);
    const bg = this.add.rectangle(w / 2, h / 2, w, h, 0x000000, 0.6).setInteractive();
    const panel = this.add.image(w / 2, h / 2, 'panel_modal').setDisplaySize(820, 980);
    overlay.add([bg, panel]);

    const title = this.add.text(w / 2, h / 2 - 380, won ? 'Level Complete!' : 'Out of Shots', {
      fontFamily: 'Segoe UI, Arial', fontSize: '58px', color: won ? '#3ecf6e' : '#e94560', fontStyle: 'bold'
    }).setOrigin(0.5);
    overlay.add(title);

    if (won) {
      for (let s = 0; s < 3; s++) {
        const st = this.add.image(w / 2 - 90 + s * 90, h / 2 - 260, s < stars ? 'star_filled' : 'star_empty');
        st.setDisplaySize(100, 100);
        st.setScale(0);
        overlay.add(st);
        this.tweens.add({ targets: st, scale: 0.86, duration: 320, delay: 200 + s * 150, ease: 'Back.easeOut' });
      }
    }

    const scoreLabel = this.add.text(w / 2, h / 2 - 120, 'Score: ' + this.score, {
      fontFamily: 'Segoe UI, Arial', fontSize: '46px', color: '#ffffff', fontStyle: 'bold'
    }).setOrigin(0.5);
    overlay.add(scoreLabel);

    if (won && this.level.id < LEVELS.length) {
      const nextBtn = createButton(this, w / 2, h / 2 + 40, 500, 130, 'panel_primary', 'NEXT LEVEL', 42, () => {
        this.scene.restart({ levelId: this.level.id + 1 });
      });
      overlay.add(nextBtn);
    } else if (won) {
      const doneTxt = this.add.text(w / 2, h / 2 + 40, 'All levels complete!', {
        fontFamily: 'Segoe UI, Arial', fontSize: '36px', color: '#ffe98a'
      }).setOrigin(0.5);
      overlay.add(doneTxt);
    } else {
      const retryBtn = createButton(this, w / 2, h / 2 + 40, 500, 130, 'panel_primary', 'RETRY', 42, () => {
        this.scene.restart({ levelId: this.level.id });
      });
      overlay.add(retryBtn);
    }

    const menuBtn = createButton(this, w / 2, h / 2 + 190, 500, 120, 'panel_secondary', 'LEVEL SELECT', 38, () => {
      this.scene.start('LevelSelect');
    });
    overlay.add(menuBtn);

    this.endOverlay = overlay;
  }

  /* ------------------------------- PAUSE ------------------------------------ */
  openPause() {
    if (this.isPaused || this.isGameOver || this.pauseOverlay) return;
    this.isPaused = true;
    this.isAiming = false;
    this.aimGraphics.clear();
    const w = CONFIG.DESIGN_W, h = CONFIG.DESIGN_H;
    const overlay = this.add.container(0, 0).setDepth(200);
    const bg = this.add.rectangle(w / 2, h / 2, w, h, 0x000000, 0.6).setInteractive();
    const panel = this.add.image(w / 2, h / 2, 'panel_modal').setDisplaySize(760, 900);
    const title = this.add.text(w / 2, h / 2 - 380, 'Paused', {
      fontFamily: 'Segoe UI, Arial', fontSize: '56px', color: '#ffffff', fontStyle: 'bold'
    }).setOrigin(0.5);
    overlay.add([bg, panel, title]);

    const resumeBtn = createButton(this, w / 2, h / 2 - 220, 480, 120, 'panel_primary', 'RESUME', 40, () => {
      this.closePause();
    });
    const restartBtn = createButton(this, w / 2, h / 2 - 80, 480, 120, 'panel_secondary', 'RESTART', 40, () => {
      this.scene.restart({ levelId: this.level.id });
    });
    const soundToggle = createToggle(this, w / 2, h / 2 + 60, 'Sound', AudioManager.soundOn, v => AudioManager.setSoundOn(v));
    const musicToggle = createToggle(this, w / 2, h / 2 + 140, 'Music', AudioManager.musicOn, v => AudioManager.setMusicOn(v));
    const menuBtn = createButton(this, w / 2, h / 2 + 280, 480, 120, 'panel_secondary', 'LEVEL SELECT', 38, () => {
      this.scene.start('LevelSelect');
    });
    overlay.add([resumeBtn, restartBtn, soundToggle, musicToggle, menuBtn]);
    this.pauseOverlay = overlay;
  }

  closePause() {
    if (!this.pauseOverlay) return;
    this.pauseOverlay.destroy();
    this.pauseOverlay = null;
    this.isPaused = false;
  }
}

/* ============================== GAME BOOTSTRAP ============================= */
window.addEventListener('error', (e) => {
  console.error('[Global] Uncaught error:', e.message, e.error);
});

const phaserConfig = {
  type: Phaser.AUTO,
  parent: 'game-root',
  width: CONFIG.DESIGN_W,
  height: CONFIG.DESIGN_H,
  backgroundColor: '#0a0e1a',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
    width: CONFIG.DESIGN_W,
    height: CONFIG.DESIGN_H
  },
  input: { activePointers: 2 },
  scene: [BootScene, PreloadScene, MenuScene, LevelSelectScene, GameScene]
};

let GAME_INSTANCE = null;
try {
  GAME_INSTANCE = new Phaser.Game(phaserConfig);
} catch (e) {
  console.error('[Boot] Failed to create Phaser game instance:', e);
  document.getElementById('game-root').innerHTML =
    '<p style="color:#fff;font-family:sans-serif;padding:20px;">Failed to start the game. Please reload the page.</p>';
}
</script>
